name: iOS IPA

# Unsigned arm64 IPA of the Z-iOS target, for sideloading (SideStore/AltStore
# re-sign it on install). Game data is not bundled: the player copies the game
# folder into Files > Another Red > game.

on:
  push:
    branches: [ios-port]
  workflow_dispatch:

jobs:
  ios:
    name: iOS arm64 (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          ruby --version
          python3 --version

      - name: Install build tools
        run: brew install autoconf automake libtool cmake meson ninja

      - name: Restore iOS dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: macos/Dependencies/build-iphoneos-arm64
          key: ios-deps-v1-${{ hashFiles('macos/Dependencies/common.make', 'macos/Dependencies/ios-arm64.make', 'macos/Dependencies/pyshim/**') }}

      - name: Build iOS dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: macos/Dependencies
        run: |
          make everything -f ios-arm64.make
          make fluidsynth -f ios-arm64.make

      # Saved right away so a later app-build failure doesn't throw away the
      # (slow) dependency build.
      - name: Save iOS dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: macos/Dependencies/build-iphoneos-arm64
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build app
        run: |
          # Z-iOS bundles the folder reference ../../game (relative to macos/);
          # CI has no game data, so give it an empty folder.
          mkdir -p "$GITHUB_WORKSPACE/../game"
          xcodebuild -project macos/mkxp-z.xcodeproj -scheme Z-iOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          app=$(find build/Build/Products -maxdepth 2 -path '*-iphoneos/*.app' | head -n 1)
          test -n "$app"
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../AnotherRed-unsigned.ipa Payload)
          ls -lh AnotherRed-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AnotherRed-ios-${{ github.sha }}
          path: AnotherRed-unsigned.ipa
